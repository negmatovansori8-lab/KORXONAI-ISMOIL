services:
  postgres:
    image: postgres:16-alpine
    container_name: oems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oems
      POSTGRES_PASSWORD: oems_secure_2026
      POSTGRES_DB: oil_enterprise
    ports:
      - "5432:5432"
    volumes:
      - oems_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oems -d oil_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oems_pg:
